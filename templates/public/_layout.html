{% extends "base.html" %}{% load static %}
{% block body %}
<header class="site-header">
  <div class="container">
    <a class="brand" href="{% url 'home' %}"><img src="{% static 'img/logo.svg' %}" alt=""><span class="ltr">pet-<b>online</b></span></a>
    <span class="spacer"></span>
    <a class="btn btn-ghost btn-sm" href="{% url 'shops_map' %}"><svg class="i i-sm"><use href="#i-map"/></svg><span>نقشه پت شاپ‌ها</span></a>
    <a class="btn btn-ghost btn-sm" href="{% url 'join' %}">ثبت پت شاپ</a>
    {% if user.is_authenticated %}
      <a class="btn btn-sm" href="{% if user.is_staff %}{% url 'manage:dashboard' %}{% else %}{% url 'panel:dashboard' %}{% endif %}">پنل من</a>
    {% else %}
      <a class="btn btn-sm" href="{% url 'login' %}">ورود</a>
    {% endif %}
  </div>
</header>
{% block content %}{% endblock %}
{% include "partials/footer.html" %}
{% endblock %}
