{% load fa %}{% if not shop.is_active %}<span class="badge badge-danger"><span class="dot"></span>غیرفعال</span>{% elif shop.has_subscription %}{% if shop.days_left < 7 %}<span class="badge badge-warning"><span class="dot"></span>{{ shop.days_left|fa }} روز</span>{% else %}<span class="badge badge-success"><span class="dot"></span>{{ shop.days_left|fa }} روز</span>{% endif %}{% else %}<span class="badge badge-danger"><span class="dot"></span>منقضی</span>{% endif %}
